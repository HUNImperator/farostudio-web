---
deployment:
  tasks:
    # A public/ mappa tartalmát a farostudio.hu gyökérmappájába másolja.
    # (A fődomain document rootja: public_html/farostudio.hu)
    - export DEPLOYPATH=$HOME/public_html/farostudio.hu/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R public/. $DEPLOYPATH
    # A tesztoldalra feltöltött blogképek átmásolása (a meglévőket nem írja felül)
    - /bin/sh -c 'if [ -d "$HOME/test.farostudio.hu/feltoltes" ]; then /bin/mkdir -p "$HOME/public_html/farostudio.hu/feltoltes" && /bin/cp -Rn "$HOME/test.farostudio.hu/feltoltes/." "$HOME/public_html/farostudio.hu/feltoltes/"; fi'
    # A lecserélt előadásfotó régi fájljainak törlése a szerverről
    - /bin/rm -f $DEPLOYPATH/assets/img/eloadas-*
