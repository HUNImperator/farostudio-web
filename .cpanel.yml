---
deployment:
  tasks:
    # A public/ mappa tartalmát másolja a teszt aldomain gyökérmappájába.
    # Ha az aldomain document rootja más, itt kell átírni.
    - export DEPLOYPATH=$HOME/test.farostudio.hu/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R public/. $DEPLOYPATH
    # A lecserélt előadásfotó régi fájljainak törlése a szerverről
    - /bin/rm -f $DEPLOYPATH/assets/img/eloadas-*
